<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyM3U - Latest Playlist Updates</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 30px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
    .card { background: #1e293b; border-radius: 10px; overflow: hidden; transition: transform 0.2s; border: 1px solid #334155; }
    .card:hover { transform: translateY(-5px); }
    .card img { width: 100%; height: 160px; object-fit: cover; display: block; }
    .card h3 { font-size: 16px; margin: 15px; color: #e2e8f0; line-height: 1.4; }
    a { text-decoration: none; }
  </style>
</head>
<body>
  <h1>SKY M3U - Latest Channels & Playlists</h1>
  <div class="grid">
    <!-- ব্লগের পোস্টগুলো এখানে ডায়নামিক বা ম্যানুয়ালি শো করবে -->
    <div class="card">
      <a href="https://www.skym3u.dev" target="_blank" rel="noopener">
        <img src="https://via.placeholder.com/400x225?text=SkyM3U" alt="Sample">
        <h3>SkyM3U অফিসিয়াল ওয়েবসাইটে স্বাগতম! লেটেস্ট আপডেট পেতে সাথেই থাকুন।</h3>
      </a>
    </div>
  </div>
</body>
</html>
